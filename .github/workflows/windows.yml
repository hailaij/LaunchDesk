name: Windows build and verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Build
        run: dotnet build LaunchDesk.slnx -c Release
      - name: Process integration tests
        run: dotnet run --project tests/LaunchDesk.Tests -c Release -- --report artifacts/test-results.json
      - name: Publish and package
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: LaunchDesk-windows-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/test-results.json
