name: Windows build and verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Locked restore
        run: dotnet restore LaunchDesk.slnx --locked-mode
      - name: Build
        run: dotnet build LaunchDesk.slnx -c Release --no-restore -warnaserror
      - name: Core, signed fixtures, UI and fault cleanup
        timeout-minutes: 10
        shell: pwsh
        run: ./tests/Invoke-CiVerification.ps1
      - name: Unsigned preview package (not a trusted update release)
        shell: pwsh
        run: ./scripts/package.ps1 -OutputDirectory artifacts/preview -UpdateSignerSha256 ''
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: LaunchDesk-verification-evidence
          if-no-files-found: error
          path: |
            artifacts/verification/**/*.json
            artifacts/verification/**/*.png
            artifacts/verification/**/*.error.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LaunchDesk-unsigned-preview
          path: |
            artifacts/preview/*.zip
            artifacts/preview/*.sha256
